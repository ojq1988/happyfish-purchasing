<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Happy Fish Purchasing</title>
<script>
/* Safety net (old-style JavaScript so it runs on any phone): shows what went wrong instead of loading forever. */
var HF_VERSION='7';
var HF_STEP='starting';
var HF_ERRORS=[];
window.onerror=function(m,src,line){HF_ERRORS.push(String(m)+(line?' (line '+line+')':''));};
window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;HF_ERRORS.push('async: '+(r&&r.message?r.message:String(r)));});
window.HF_STALL=setTimeout(function(){
  var el=document.getElementById('app'); if(!el||!document.getElementById('hfload')) return;
  var t=window.Telegram&&window.Telegram.WebApp;
  var info='Version '+HF_VERSION+' · Step: '+HF_STEP+' · Telegram: '+(t?'yes':'no')+' · Login data: '+(t&&t.initData?'yes':'no')+' · Server link: '+(location.search.indexOf('api=')>=0?'yes':'no');
  el.innerHTML='<div class="center"><div><div style="font-size:40px">⚠️</div><p><b>Still loading…</b></p><p>'+info+'</p>'+(HF_ERRORS.length?'<p>Error: '+HF_ERRORS.join(' | ').replace(/</g,'&lt;')+'</p>':'<p>No error yet. The Google script may be slow or not answering.</p>')+'<p><button class="btn main" type="button" onclick="location.reload()">Try again</button></p></div></div>';
},20000);
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Follows the viewer's Telegram colours. Layout: tabs on top, one column of cards. */
:root{
  --bg:var(--tg-theme-secondary-bg-color,#eef3f5);
  --card:var(--tg-theme-bg-color,#ffffff);
  --ink:var(--tg-theme-text-color,#13232b);
  --muted:var(--tg-theme-hint-color,#6b7c84);
  --accent:var(--tg-theme-button-color,#0a6a85);
  --accent-ink:var(--tg-theme-button-text-color,#ffffff);
  --link:var(--tg-theme-link-color,#0a6a85);
  --line:color-mix(in srgb,var(--muted) 22%,transparent);
  --bad:#d23b2f; --warn:#c27a00; --good:#1f8a52;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding:12px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;display:grid;gap:12px}
.head{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;flex:none}
.head h1{font-size:18px;margin:0;line-height:1.15}
.head .sub{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:12px;padding:4px;gap:4px;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--line)}
.tabs button{border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;position:relative}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11.5px;line-height:18px;margin-left:4px}
.card{background:var(--card);border-radius:14px;padding:14px;display:grid;gap:12px}
.card h2{font-size:16px;margin:0}
label.f{display:grid;gap:5px;font-size:13.5px;color:var(--muted);font-weight:600}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;color:var(--ink);font-weight:400;font-size:16px}
textarea.i{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.urg.on{background:var(--bad);border-color:var(--bad);color:#fff}
.hint{font-size:13px;color:var(--muted)}
.hint.warn{color:var(--warn)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;padding:0;cursor:pointer}
.addph{width:76px;height:76px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;cursor:pointer;background:none}
.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.btn:disabled{opacity:.55}
.btn.block{width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -1px 0 var(--line);z-index:6}
.bar .btn{max-width:612px;margin:0 auto;display:block;width:100%;font-size:16.5px;padding:14px}
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 4px -4px}
.req{background:var(--card);border-radius:14px;padding:12px 14px;display:grid;gap:6px;border-left:4px solid transparent;cursor:pointer}
.req.urgent{border-left-color:var(--bad)}
.req .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.req .it{font-weight:650;line-height:1.3}
.req .meta{font-size:13.5px;color:var(--muted)}
.ref{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent)}
.pill.new{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}
.pill.wait{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}
.pill.purchased{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--good)}
.pill.received{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--good)}
.pill.rejected,.pill.cancelled{background:color-mix(in srgb,var(--muted) 16%,var(--card));color:var(--muted)}
.det{display:grid;gap:8px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px;cursor:auto}
.det dl{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;margin:0;font-size:14px}
.det dt{color:var(--muted)}
.det dd{margin:0;overflow-wrap:anywhere}
.det a{color:var(--link)}
.notes{font-size:13.5px;background:var(--bg);border-radius:10px;padding:8px 10px;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1 1 auto;padding:10px 12px;font-size:14.5px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:15px}
.banner{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner span{font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:20;max-width:90vw;text-align:center}
.toast.err{background:var(--bad);color:#fff}
.center{display:grid;place-items:center;min-height:60vh;text-align:center;color:var(--muted);padding:20px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center" id="hfload"><div><div class="spin"></div>Loading… <span style="opacity:.6">(v7)</span></div></div></div>
<div class="bar" id="bar" hidden></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
const API = new URLSearchParams(location.search).get('api') || '';
const S = { data:null, tab:'new', open:null, panel:null, busy:false,
  form:{branch:'',category:'',item:'',qty:'',need:'',needKey:'',urgent:false,links:'',details:'',photos:[]},
  reg:{name:'',role:'',branch:''}, home:null };

function hfEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
function haptic(t){try{tg.HapticFeedback.notificationOccurred(t)}catch(_){}}
let toastT;
function hfToast(msg,err){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.className='toast'+(err?' err':'');t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3500)}

async function hfCall(body){
  const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), 45000);
  let res;
  HF_STEP='sending';
  try{ res = await fetch(API,{method:'POST',body:JSON.stringify(Object.assign({initData:tg?tg.initData:''},body)),signal:ctl.signal}); }
  catch(e){ clearTimeout(timer); throw new Error(e.name==='AbortError'?'Code T: the server took too long to answer.':'Code N: could not connect to the Google script.'); }
  HF_STEP='reply HTTP '+res.status;
  if(!res.ok){ clearTimeout(timer); throw new Error('Code H'+res.status+': the Google script returned an error.'); }
  let txt;
  try{ txt = await res.text(); }
  catch(e){ throw new Error('Code B: the reply from the Google script was cut off.'); }
  finally{ clearTimeout(timer); }
  HF_STEP='reply read ('+txt.length+' chars)';
  try{ const j=JSON.parse(txt); HF_STEP='reply understood'; return j; }
  catch(e){ throw new Error(/did not return anything|completed but/i.test(txt) ? 'Code V: the Google script is running an old version. Update the deployment to a New version.' : /sign in|accounts\.google/i.test(txt) ? 'Code A: the Google script needs access set to "Anyone".' : 'Code J: the Google script sent back something unexpected.'); }
}
async function hfRun(body, okMsg){
  if(S.busy) return; S.busy=true; hfRender();
  try{
    const d = await hfCall(body);
    HF_STEP='showing screen';
    if(d.error==='notelegram'){S.data={notelegram:true};return}
    if(d.error && !d.me){if(!S.data)S.data={failed:d.error};hfToast(d.error,true);haptic('error');return}
    S.data = d;
    if(d.error){hfToast(d.error,true);haptic('error')}
    else if(d.done||okMsg){hfToast(d.done||okMsg);haptic('success')}
    return d;
  }catch(e){if(!S.data||S.data.failed)S.data={failed:e.message};else hfToast(e.message,true);haptic('error')}
  finally{S.busy=false;hfRender()}
}

/* ---------- views ---------- */
const STATUS = {
  'new':['new','Waiting for approval'], 'waiting approval':['wait','Waiting for approver'], 'approved':['approved','Approved, to buy'],
  'purchased':['purchased','Purchased'], 'received':['received','Received'], 'rejected':['rejected','Not approved'], 'cancelled':['cancelled','Cancelled']
};
const OPEN = ['new','waiting approval','approved','purchased'];
function hfPill(r){const s=STATUS[r.status]||['',r.status];return `<span class="pill ${s[0]}">${hfEsc(s[1])}</span>`}

function hfRender(){
  try{ render_(); }
  catch(e){
    HF_ERRORS.push('screen: '+(e&&e.message?e.message:e));
    document.getElementById('app').innerHTML=`<div class="center"><div><div style="font-size:40px">⚠️</div><p><b>Couldn't show the screen</b></p><p>Code R: ${hfEsc(HF_ERRORS.join(' | '))}</p><p>Step: ${hfEsc(HF_STEP)} · v${HF_VERSION}</p><p><button class="btn main" type="button" onclick="location.reload()">Try again</button></p></div></div>`;
  }
}
function render_(){
  const app=document.getElementById('app'), bar=document.getElementById('bar');
  bar.hidden=true;
  if(!tg || !tg.initData){app.innerHTML=`<div class="center"><div><div style="font-size:40px">🐟</div><p><b>Open this from Telegram</b></p><p>This app works inside the Happy Fish Purchasing bot. Open the bot in Telegram and tap <b>Open app</b>.</p></div></div>`;return}
  if(!API){app.innerHTML=`<div class="center"><p>This app link is missing its server address. Ask the purchaser to check the app link in BotFather.</p></div>`;return}
  const d=S.data;
  if(!d){app.innerHTML=`<div class="center" id="hfload"><div><div class="spin"></div>Connecting to the server… <span style="opacity:.6">(v7)</span></div></div>`;return}
  if(d.failed){app.innerHTML=`<div class="center"><div><div style="font-size:40px">⚠️</div><p><b>Couldn't load</b></p><p>${hfEsc(d.failed)}</p><p><button class="btn main" id="retry" type="button">Try again</button></p></div></div>`;document.getElementById('retry').onclick=()=>{S.data=null;hfRender();hfRun({action:'init'})};return}
  if(d.notelegram){app.innerHTML=`<div class="center"><p>Telegram couldn't confirm who you are. Close this and open it again from the bot.</p></div>`;return}
  if(!d.me){app.innerHTML=hfHead()+regView();bindReg();return}
  if(d.me.status==='pending'){app.innerHTML=hfHead()+`<div class="card"><h2>⏳ Waiting for approval</h2><p class="hint">Thanks, ${hfEsc(d.me.name)}. The purchaser has been asked to approve you. You'll get a Telegram message when it's done, then open this app again.</p><button class="btn" id="reload" type="button">Check again</button></div>`;document.getElementById('reload').onclick=()=>hfRun({action:'init'});return}
  if(d.me.status!=='active'){app.innerHTML=hfHead()+`<div class="card"><p>Your access isn't active. Please contact the purchaser.</p></div>`;return}

  const showTodo = d.me.purchaser || d.me.approver;
  if(S.tab==='todo' && !showTodo) S.tab='new';
  const todoCount = (d.requests||[]).filter(r=>r.can.approve||r.can.purchased).length;
  const mineOpen = (d.requests||[]).filter(r=>r.mine&&r.can.received).length;
  let h = hfHead() + homeBanner() + `<nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="new" class="${S.tab==='new'?'on':''}">🛒 Request</button>
    <button type="button" role="tab" data-tab="mine" class="${S.tab==='mine'?'on':''}">📋 Mine${mineOpen?`<span class="badge">${mineOpen}</span>`:''}</button>
    ${showTodo?`<button type="button" role="tab" data-tab="todo" class="${S.tab==='todo'?'on':''}">📥 To do${todoCount?`<span class="badge">${todoCount}</span>`:''}</button>`:''}
  </nav>`;
  if(S.tab==='new'){h+=formView();bar.hidden=false;bar.innerHTML=`<button class="btn main" id="submit" type="button" ${S.busy?'disabled':''}>${S.busy?'Sending…':'Send request'}</button>`}
  else if(S.tab==='mine') h+=mineView();
  else h+=todoView();
  app.innerHTML=h;
  bindMain();
}
function hfHead(){
  const me=S.data&&S.data.me;
  return `<div class="head"><div class="logo" aria-hidden="true">🐟</div><div><h1>Happy Fish Purchasing</h1><div class="sub">${me?hfEsc(me.name)+' · '+hfEsc(me.purchaser?'Purchaser':me.role):'Purchase requests for all branches'}</div></div></div>`;
}
function homeBanner(){
  if(S.home!=='missed') return '';
  return `<div class="banner"><span>📲 Add this app to your phone's home screen for one-tap requests.</span><button class="btn main" id="addhome" type="button" style="padding:8px 12px">Add</button></div>`;
}

/* registration */
function regView(){
  const d=S.data, r=S.reg; if(!r.name) r.name=d.tgName||'';
  return `<div class="card"><h2>👋 Welcome! Quick registration</h2><p class="hint">Do this once. The purchaser approves new users.</p>
    <label class="f">Your name<input class="i" id="rg_name" value="${hfEsc(r.name)}" autocomplete="name"></label>
    <label class="f">Your role<select class="i" id="rg_role"><option value="">Choose…</option>${d.roles.map(x=>`<option${x===r.role?' selected':''}>${hfEsc(x)}</option>`).join('')}</select></label>
    <label class="f">Your branch<select class="i" id="rg_branch"><option value="">Choose…</option>${d.branches.concat([d.allBranches]).map(x=>`<option${x===r.branch?' selected':''}>${hfEsc(x)}</option>`).join('')}</select></label>
    <button class="btn main block" id="rg_go" type="button" ${S.busy?'disabled':''}>${S.busy?'Sending…':'Register'}</button></div>`;
}
function bindReg(){
  const g=id=>document.getElementById(id);
  ['name','role','branch'].forEach(k=>g('rg_'+k).addEventListener('input',e=>S.reg[k]=e.target.value));
  g('rg_go').onclick=()=>{const r=S.reg;if(!r.name.trim()||!r.role||!r.branch){hfToast('Please fill in all three.',true);return}hfRun({action:'register',name:r.name,role:r.role,branch:r.branch})};
}

/* new request form */
const NEEDS=[['urg','🔴 Urgent, today',0],['1','Tomorrow',1],['3','In 3 days',3],['7','In a week',7],['14','In 2 weeks',14],['none','No rush',null],['date','📅 Pick date',null]];
function formView(){
  const d=S.data, f=S.form;
  if(!f.branch) f.branch = d.branches.includes(d.me.branch)?d.me.branch:'';
  if(!f.category) f.category = '';
  const cat=d.categories.find(c=>c.name===f.category);
  const route = cat&&cat.approvers.length ? `Goes to ${cat.approvers.join(' / ')} for approval first.` : '';
  return `<div class="card">
    <label class="f">Branch<select class="i" data-f="branch"><option value="">Choose branch…</option>${d.branches.concat([d.allBranches]).map(x=>`<option${x===f.branch?' selected':''}>${hfEsc(x)}</option>`).join('')}</select></label>
    <label class="f">Category<select class="i" data-f="category"><option value="">Choose category…</option>${d.categories.map(c=>`<option${c.name===f.category?' selected':''}>${hfEsc(c.name)}</option>`).join('')}</select></label>
    ${route?`<div class="hint warn">⏳ ${hfEsc(route)}</div>`:''}
    <label class="f">What do you need?<input class="i" data-f="item" value="${hfEsc(f.item)}" placeholder="e.g. Kickboards, junior size"></label>
    <label class="f">Quantity<input class="i" data-f="qty" value="${hfEsc(f.qty)}" placeholder="e.g. 10 pcs, 3 boxes"></label>
    <div class="f" style="display:grid;gap:6px"><span class="hint" style="font-weight:600">When do you need it?</span>
      <div class="chips">${NEEDS.map(n=>`<button type="button" class="chip ${n[0]==='urg'?'urg':''} ${f.needKey===n[0]?'on':''}" data-need="${n[0]}">${n[1]}</button>`).join('')}</div>
      ${f.needKey==='date'?`<input class="i" type="date" data-f="need" value="${hfEsc(f.need)}" min="${ymd(new Date())}">`:''}
    </div>
    <div class="f" style="display:grid;gap:6px"><span class="hint" style="font-weight:600">Photos (optional, up to 6)</span>
      <div class="thumbs">${f.photos.map((p,i)=>`<div class="thumb"><img src="${p}" alt="Photo ${i+1}"><button type="button" data-rmph="${i}" aria-label="Remove photo ${i+1}">×</button></div>`).join('')}
      ${f.photos.length<6?`<button type="button" class="addph" id="addph">📷<br>Add</button>`:''}</div>
      <input type="file" id="phinput" accept="image/*" multiple hidden>
    </div>
    <label class="f">Links (optional)<textarea class="i" data-f="links" placeholder="Paste Shopee, Lazada or supplier links, one per line" style="min-height:60px">${hfEsc(f.links)}</textarea></label>
    <label class="f">More details (optional)<textarea class="i" data-f="details" placeholder="Size, colour, brand, why it's needed…">${hfEsc(f.details)}</textarea></label>
  </div>`;
}

/* lists */
function reqCard(r){
  const open=S.open===r.ref;
  let h=`<div class="req ${r.urgent&&OPEN.includes(r.status)?'urgent':''}" data-ref="${hfEsc(r.ref)}">
    <div class="top"><div class="it">${hfEsc(r.item)}${r.qty?` <span class="meta">× ${hfEsc(r.qty)}</span>`:''}</div>${hfPill(r)}</div>
    <div class="meta">${hfEsc(r.branch)}${r.mine?'':' · '+hfEsc(r.requester)}${r.needText?' · by '+hfEsc(r.needText):''}${r.urgent&&OPEN.includes(r.status)?' · <b style="color:var(--bad)">Urgent</b>':''}</div>
    ${S.data.team&&S.data.me.purchaser&&OPEN.includes(r.status)?`<div class="meta">👤 ${r.assignee?(r.assignedToMe?'You':hfEsc(r.assignee)):'Not assigned yet'}</div>`:''}`;
  if(open) h+=hfDetail(r);
  return h+'</div>';
}
function hfDetail(r){
  const c=r.can, p=S.panel&&S.panel.ref===r.ref?S.panel:null;
  let h=`<div class="det" data-stop="1"><dl>
    <dt>Request no.</dt><dd class="ref">${hfEsc(r.ref)}</dd>
    <dt>Category</dt><dd>${hfEsc(r.category)}</dd>
    <dt>Asked by</dt><dd>${hfEsc(r.requester)} (${hfEsc(r.role)})</dd>
    <dt>Sent</dt><dd>${hfEsc(r.created)}</dd>
    ${r.status==='waiting approval'?`<dt>Approver</dt><dd>${hfEsc(r.approver)}</dd>`:''}
    ${S.data.team&&OPEN.includes(r.status)?`<dt>Handled by</dt><dd>${r.assignee?hfEsc(r.assignee):'Not assigned yet'}</dd>`:''}
    ${r.decidedBy?`<dt>Decided by</dt><dd>${hfEsc(r.decidedBy)}</dd>`:''}
    ${r.purchasedAt?`<dt>Purchased</dt><dd>${hfEsc(r.purchasedAt)}</dd>`:''}
    ${r.receivedAt?`<dt>Received</dt><dd>${hfEsc(r.receivedAt)}</dd>`:''}
    ${r.details?`<dt>Details</dt><dd>${hfEsc(r.details)}</dd>`:''}
    ${r.links.length?`<dt>Links</dt><dd>${r.links.map(l=>`<a href="${hfEsc(l)}" data-link="${hfEsc(l)}">${hfEsc(l.length>48?l.slice(0,46)+'…':l)}</a>`).join('<br>')}</dd>`:''}
    ${r.files?`<dt>Photos</dt><dd>${r.files} attached</dd>`:''}
  </dl>${r.notes.length?`<div class="notes">${r.notes.map(hfEsc).join('\n')}</div>`:''}`;
  if(p){
    const label={reject:'Reason (the requester will see it)',note:'Update for the requester, e.g. supplier, price, ETA',message:'Your message'}[p.what];
    h+=`<label class="f">${label}<textarea class="i" id="ptext">${hfEsc(p.text||'')}</textarea></label>
      <div class="acts"><button class="btn ${p.what==='reject'?'bad':'main'}" data-act="${p.what}" data-send="1" type="button" ${S.busy?'disabled':''}>${p.what==='reject'?'Not approved':p.what==='note'?'Save note':'Send'}</button><button class="btn" data-cancelpanel="1" type="button">Back</button></div>`;
  } else {
    const b=[];
    if(c.take) b.push(`<button class="btn main" data-act="take" type="button">🙋 ${r.assignee?'Take over from '+hfEsc(String(r.assignee).split(' ')[0]):"I'll handle this"}</button>`);
    (c.give||[]).forEach(p=>b.push(`<button class="btn" data-act="give" data-target="${hfEsc(p.id)}" type="button">👉 Give to ${hfEsc(String(p.name).split(' ')[0])}</button>`));
    if(c.approve) b.push(`<button class="btn good" data-act="approve" type="button">✅ Approve</button>`);
    if(c.reject) b.push(`<button class="btn bad" data-act="reject" data-panel="1" type="button">❌ Not approved</button>`);
    if(c.purchased) b.push(`<button class="btn good" data-act="purchased" type="button">🛒 Mark purchased</button>`);
    if(c.received) b.push(`<button class="btn good" data-act="received" type="button">📦 Received</button>`);
    if(c.note) b.push(`<button class="btn" data-act="note" data-panel="1" type="button">📝 Add note</button>`);
    if(c.message) b.push(`<button class="btn" data-act="message" data-panel="1" type="button">💬 ${r.mine&&!S.data.me.purchaser?'Message purchaser':'Message '+hfEsc(String(r.requester).split(' ')[0])}</button>`);
    if(c.photos) b.push(`<button class="btn" data-act="photos" type="button">📷 See photos in chat</button>`);
    if(c.undo) b.push(`<button class="btn" data-act="undo" type="button">↩️ ${hfEsc(r.undoLabel)}</button>`);
    if(c.cancel) b.push(`<button class="btn bad" data-act="cancel" type="button">🚫 Cancel request</button>`);
    if(b.length) h+=`<div class="acts">${b.join('')}</div>`;
  }
  return h+'</div>';
}
function hfSection(title, list){return list.length?`<div class="sec">${hfEsc(title)} (${list.length})</div>`+list.map(reqCard).join(''):''}
function byPrio(a,b){if(a.urgent!==b.urgent)return a.urgent?-1:1;const na=a.need||'9999',nb=b.need||'9999';return na<nb?-1:na>nb?1:(a.ref<b.ref?-1:1)}
function mineView(){
  const rs=(S.data.requests||[]).filter(r=>r.mine);
  if(!rs.length) return `<div class="empty">You haven't sent any requests yet.<br>Tap <b>🛒 Request</b> to start.</div>`;
  return hfSection('Open',rs.filter(r=>OPEN.includes(r.status)).sort(byPrio))+hfSection('Closed',rs.filter(r=>!OPEN.includes(r.status)).slice(0,20))+refreshBtn();
}
function todoView(){
  const rs=S.data.requests||[], me=S.data.me;
  let h='';
  if(me.purchaser){
    const mineOrFree=r=>r.assignedToMe||!r.assignee;
    h+=hfSection('Waiting for approval',rs.filter(r=>r.status==='new'&&mineOrFree(r)).sort(byPrio));
    if(S.data.team){
      h+=hfSection('To buy: mine',rs.filter(r=>r.status==='approved'&&r.assignedToMe).sort(byPrio));
      h+=hfSection('To buy: not assigned yet',rs.filter(r=>r.status==='approved'&&!r.assignee).sort(byPrio));
    } else h+=hfSection('Approved, to buy',rs.filter(r=>r.status==='approved').sort(byPrio));
    h+=hfSection('Purchased, waiting for branch',rs.filter(r=>r.status==='purchased'&&mineOrFree(r)).sort(byPrio));
    h+=hfSection('With Ops Manager / Head Coach',rs.filter(r=>r.status==='waiting approval').sort(byPrio));
    if(S.data.team) h+=hfSection('Handled by others',rs.filter(r=>OPEN.includes(r.status)&&r.assignee&&!r.assignedToMe).sort(byPrio));
  } else {
    h+=hfSection('Waiting for your approval',rs.filter(r=>r.status==='waiting approval'&&r.can.approve).sort(byPrio));
  }
  return (h||`<div class="empty">🎉 Nothing is waiting on you.</div>`)+refreshBtn();
}
function refreshBtn(){return `<button class="btn block" id="refresh" type="button" ${S.busy?'disabled':''}>${S.busy?'Loading…':'↻ Refresh'}</button>`}

/* ---------- events ---------- */
function bindMain(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.open=null;S.panel=null;hfRender();window.scrollTo(0,0)});
  const ah=document.getElementById('addhome'); if(ah) ah.onclick=()=>{try{tg.addToHomeScreen()}catch(_){}};
  const rf=document.getElementById('refresh'); if(rf) rf.onclick=()=>hfRun({action:'init'});
  if(S.tab==='new') bindForm();
  document.querySelectorAll('.req').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('[data-stop]')) return;
    S.open = S.open===el.dataset.ref?null:el.dataset.ref; S.panel=null; hfRender();
  }));
  document.querySelectorAll('[data-link]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();try{tg.openLink(a.dataset.link)}catch(_){window.open(a.dataset.link)}}));
  document.querySelectorAll('[data-cancelpanel]').forEach(b=>b.onclick=()=>{S.panel=null;hfRender()});
  const pt=document.getElementById('ptext'); if(pt){pt.addEventListener('input',e=>S.panel.text=e.target.value);pt.focus()}
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const ref=S.open, what=b.dataset.act;
    if(b.dataset.panel){S.panel={ref,what,text:''};hfRender();return}
    const text=b.dataset.target?b.dataset.target:(b.dataset.send?(S.panel&&S.panel.text||'').trim():'');
    if(b.dataset.send&&what!=='reject'&&!text){hfToast('Type something first.',true);return}
    const go=()=>hfRun({action:'act',ref,what,text}).then(d=>{if(d&&!d.error){S.panel=null;hfRender()}});
    if(what==='cancel'){confirmThen('Cancel this request?',go)}else if(what==='undo'){confirmThen(r0Label()+'?',go)}else go();
  });
}
function r0Label(){const r=(S.data.requests||[]).find(x=>x.ref===S.open);return r?r.undoLabel:'Undo'}
function confirmThen(msg,fn){try{tg.showConfirm(msg,ok=>{if(ok)fn()})}catch(_){fn()}}
function bindForm(){
  const f=S.form;
  document.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener('input',e=>{f[el.dataset.f]=e.target.value});
    if(el.tagName==='SELECT') el.addEventListener('change',()=>hfRender());
  });
  document.querySelectorAll('[data-need]').forEach(b=>b.onclick=()=>{
    const n=NEEDS.find(x=>x[0]===b.dataset.need); f.needKey=n[0]; f.urgent=n[0]==='urg';
    f.need = n[2]===null ? (n[0]==='date'?f.need:'') : addDays(n[2]); hfRender();
  });
  const add=document.getElementById('addph'), inp=document.getElementById('phinput');
  if(add) add.onclick=()=>inp.click();
  inp.onchange=async()=>{
    const files=[...inp.files].slice(0,6-f.photos.length);
    for(const file of files){try{f.photos.push(await shrink(file))}catch(_){hfToast("Couldn't read one of the photos.",true)}}
    hfRender();
  };
  document.querySelectorAll('[data-rmph]').forEach(b=>b.onclick=()=>{f.photos.splice(Number(b.dataset.rmph),1);hfRender()});
  const sb=document.getElementById('submit');
  if(sb) sb.onclick=async()=>{
    if(!f.branch){hfToast('Please choose a branch.',true);return}
    if(!f.category){hfToast('Please choose a category.',true);return}
    if(!f.item.trim()){hfToast('Please type what you need.',true);return}
    if(!f.qty.trim()){hfToast('Please add the quantity.',true);return}
    if(f.needKey==='date'&&!f.need){hfToast('Please pick the date.',true);return}
    const d=await hfRun({action:'submit',branch:f.branch,category:f.category,item:f.item,qty:f.qty,need:f.need,urgent:f.urgent,links:f.links,details:f.details,photos:f.photos});
    if(d&&!d.error){S.form={branch:f.branch,category:'',item:'',qty:'',need:'',needKey:'',urgent:false,links:'',details:'',photos:[]};S.tab='mine';hfRender();window.scrollTo(0,0)}
  };
}
function shrink(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1280, k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject()};
    img.src=url;
  });
}

/* ---------- start ---------- */
if(tg){
  tg.ready(); tg.expand();
  try{tg.setHeaderColor('secondary_bg_color')}catch(_){}
  try{ if(tg.isVersionAtLeast&&tg.isVersionAtLeast('8.0')) tg.checkHomeScreenStatus(st=>{S.home=st;hfRender()}); }catch(_){}
  try{ tg.onEvent('homeScreenAdded',()=>{S.home='added';hfToast('Added to your home screen 🎉');hfRender()}); }catch(_){}
}
hfRender();
if(tg&&tg.initData&&API) hfRun({action:'init'});
</script>
