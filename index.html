<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Happy Fish Purchasing</title>
<script>
/* Safety net (old-style JavaScript so it runs on any phone): shows what went wrong instead of loading forever. */
var HF_VERSION='20';
var HF_STEP='starting';
var HF_ERRORS=[];
window.onerror=function(m,src,line){HF_ERRORS.push(String(m)+(line?' (line '+line+')':''));};
window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;HF_ERRORS.push('async: '+(r&&r.message?r.message:String(r)));});
window.HF_STALL=setTimeout(function(){
  var el=document.getElementById('app'); if(!el||!document.getElementById('hfload')) return;
  var t=window.Telegram&&window.Telegram.WebApp;
  var info='Version '+HF_VERSION+' · Step: '+HF_STEP+' · Telegram: '+(t?'yes':'no')+' · Login data: '+(t&&t.initData?'yes':'no')+' · Server link: '+(location.search.indexOf('api=')>=0?'yes':'no');
  el.innerHTML='<div class="center"><div><div style="font-size:40px">⚠️</div><p><b>Still loading…</b></p><p>'+info+'</p>'+(HF_ERRORS.length?'<p>Error: '+HF_ERRORS.join(' | ').replace(/</g,'&lt;')+'</p>':'<p>No error yet. The Google script may be slow or not answering.</p>')+'<p><button class="btn main" type="button" onclick="location.reload()">Try again</button></p></div></div>';
},20000);
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Follows the viewer's Telegram colours. Layout: tabs on top, one column of cards. */
:root{
  --bg:var(--tg-theme-secondary-bg-color,#eef3f5);
  --card:var(--tg-theme-bg-color,#ffffff);
  --ink:var(--tg-theme-text-color,#13232b);
  --muted:var(--tg-theme-hint-color,#6b7c84);
  --accent:#0b8fd6;
  --accent-ink:#ffffff;
  --link:var(--tg-theme-link-color,#0b7fc0);
  --line:color-mix(in srgb,var(--muted) 22%,transparent);
  --bad:#e5484d; --warn:#e8890c; --good:#1fa463;
  /* one colour per stage, used for card stripes, pills and section dots */
  --c-new:#f08c00; --c-wait:#8b5cf6; --c-approved:#0b8fd6; --c-purchased:#1fa463; --c-received:#0fa3a3; --c-closed:#8a979e; --c-hold:#b7791f;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}

.wrap{padding:12px 14px calc(100px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;display:grid;gap:14px}

.tabs button{border:0;background:none;padding:7px 4px 8px;border-radius:10px;font-weight:650;font-size:13.5px;color:var(--muted);cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap}

.bar .btn{max-width:612px;margin:0 auto;display:block;width:100%;font-size:16.5px;padding:14px}

.req::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sc)}
.req.s-new{--sc:var(--c-new)} .req.s-wait{--sc:var(--c-wait)} .req.s-approved{--sc:var(--c-approved)} .req.s-purchased{--sc:var(--c-purchased)} .req.s-received{--sc:var(--c-received)} .req.s-rejected,.req.s-cancelled{--sc:var(--c-closed)}
.req.urgent{background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 7%,var(--card)),var(--card) 60%)}
.req.open{box-shadow:0 8px 22px -8px color-mix(in srgb,var(--sc) 55%,transparent)}
.req .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.req .it{font-weight:700;font-size:16.5px;line-height:1.3}
.req .meta{font-size:13.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag.urg{background:var(--bad);color:#fff}
.tag.for{background:#f5c518;color:#4a3500}
.newbtn{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;align-items:center;gap:0;border:0;border-radius:14px;padding:6px 12px;background:rgba(255,255,255,.22);color:#fff;font-size:20px;line-height:1.1;cursor:pointer}
.newbtn span{font-size:11.5px;font-weight:700}
.newbtn.on{background:#fff;color:var(--sea1)}
.newhead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;margin:2px 2px -4px}
.newhead .btn{width:auto;padding:7px 14px}
.badge.hb{background:#b7791f}
.tag.hold{background:#fdf0d5;color:#8a5a0b;border:1px dashed #d9a441}
.req.held{--sc:var(--c-hold);background:repeating-linear-gradient(135deg,var(--card) 0 14px,color-mix(in srgb,#d9a441 7%,var(--card)) 14px 28px)}
.req.held .pill{opacity:.65}
.irow.heldi{background:#fdf6e6}
.heldw{color:#8a5a0b!important;font-weight:600}
.holdbox{background:#fdf0d5;color:#5c3d06;border:1px dashed #d9a441;border-radius:12px;padding:10px 12px;font-size:14.5px}
.holdbox .meta{color:#8a5a0b;font-size:12.5px;margin-top:2px}
.btn.hold{background:#fdf0d5;color:#8a5a0b}
.tag.msg{background:#e5484d;color:#fff;animation:hfpulse 1.6s ease-in-out 3}

.req.hasmsg{border-color:#e5484d}
.msgban{background:color-mix(in srgb,#e5484d 9%,var(--card));border:1px solid color-mix(in srgb,#e5484d 35%,transparent);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.mbh{display:flex;align-items:center;gap:8px;color:#c62f34;font-size:15px}
.mbl{display:grid;gap:6px}
.mbi{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;text-align:left;border:0;background:var(--card);border-radius:11px;padding:9px 12px;cursor:pointer;color:var(--ink);font:inherit}
.mbi span:first-child{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbi small{grid-column:1;color:var(--muted);font-size:12.5px}
.mbc{grid-column:2;grid-row:1/span 2;background:#e5484d;color:#fff;border-radius:999px;min-width:24px;text-align:center;font-weight:700;font-size:13px;padding:2px 7px}
.thread{display:grid;gap:8px;padding:10px;border-radius:12px;background:var(--bg)}
.thread .th{font-weight:700;font-size:14px}
.bub{max-width:85%;padding:8px 11px;border-radius:14px 14px 14px 4px;background:var(--card);font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bub.me{justify-self:end;border-radius:14px 14px 4px 14px;background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.bub.note{border-left:3px solid var(--c-approved)}
.bub.stat{border-left:3px solid var(--c-purchased);background:color-mix(in srgb,var(--c-purchased) 7%,var(--card))}
.bub .bn{font-size:11.5px;color:var(--muted);margin-bottom:2px;white-space:normal}
.thread .reply{justify-self:start;padding:9px 16px;background:linear-gradient(120deg,var(--sea1),var(--sea2));color:#fff;border:0}
.tag.late{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}

.det a{color:var(--link)}

.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1 1 auto;padding:10px 12px;font-size:14.5px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:15px}
.banner{background:color-mix(in srgb,var(--c-new) 14%,var(--card));border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner span{font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:20;max-width:90vw;text-align:center}
.toast.err{background:var(--bad);color:#fff}
.center{display:grid;place-items:center;min-height:60vh;text-align:center;color:var(--muted);padding:20px}

<body>
<div class="wrap" id="app"><div class="center" id="hfload"><div><div class="spin"></div>Loading… <span style="opacity:.6">(v10)</span></div></div></div>
<div class="bar" id="bar" hidden></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
const API = new URLSearchParams(location.search).get('api') || '';
const S = { data:null, tab:'', open:null, panel:null, busy:false,
  form:{branch:'',items:[{n:'',q:'',c:''}],need:'',needKey:'',urgent:false,links:'',details:'',photos:[]},
  reg:{name:'',role:'',branch:''}, home:null };

function hfEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
function haptic(t){try{tg.HapticFeedback.notificationOccurred(t)}catch(_){}}
let toastT;
function hfToast(msg,err){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.className='toast'+(err?' err':'');t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3500)}

async function hfCall(body){
  const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), 45000);
  let res;
  HF_STEP='sending';
  try{ res = await fetch(API,{method:'POST',body:JSON.stringify(Object.assign({initData:tg?tg.initData:''},body)),signal:ctl.signal}); }
  catch(e){ clearTimeout(timer); throw new Error(e.name==='AbortError'?'Code T: the server took too long to answer.':'Code N: could not connect to the Google script.'); }
  HF_STEP='reply HTTP '+res.status;
  if(!res.ok){ clearTimeout(timer); throw new Error('Code H'+res.status+': the Google script returned an error.'); }
  let txt;
  try{ txt = await res.text(); }
  catch(e){ throw new Error('Code B: the reply from the Google script was cut off.'); }
  finally{ clearTimeout(timer); }
  HF_STEP='reply read ('+txt.length+' chars)';
  try{ const j=JSON.parse(txt); HF_STEP='reply understood'; return j; }
  catch(e){ throw new Error(/did not return anything|completed but/i.test(txt) ? 'Code V: the Google script is running an old version. Update the deployment to a New version.' : /sign in|accounts\.google/i.test(txt) ? 'Code A: the Google script needs access set to "Anyone".' : 'Code J: the Google script sent back something unexpected.'); }
}
function hfNewLbl(n,m){return m>=n?`💬 ${n} new message${n>1?'s':''}`:m?`🔔 ${n} new (${m} message${m>1?'s':''})`:`🔔 ${n} new update${n>1?'s':''}`}
/** Clears the "new message" marker once a task is opened (quietly, no toast). */
function hfSeen(ref){
  const r=(S.data.requests||[]).find(x=>x.ref===ref);
  if(!r||!r.unread) return;
  r.unread=0; hfRender();
  hfCall({action:'act',ref,what:'seen'}).catch(()=>{});
}
async function hfRun(body, okMsg){
  if(S.busy) return; S.busy=true; hfRender();
  try{
    const d = await hfCall(body);
    HF_STEP='showing screen';
    if(d.error==='notelegram'){S.data={notelegram:true};return}
    if(d.error && !d.me){if(!S.data)S.data={failed:d.error};hfToast(d.error,true);haptic('error');return}
    S.data = d;
    if(d.error){hfToast(d.error,true);haptic('error')}
    else if(d.done||okMsg){hfToast(d.done||okMsg);haptic('success')}
    return d;
  }catch(e){if(!S.data||S.data.failed)S.data={failed:e.message};else hfToast(e.message,true);haptic('error')}
  finally{S.busy=false;hfRender()}
}

/* ---------- views ---------- */
const STATUS = {
  'new':['new','🆕 To approve'], 'waiting approval':['wait','⏳ With approver'], 'approved':['approved','🛒 To buy'],
  'purchased':['purchased','✅ Purchased'], 'received':['purchased','✅ Purchased'], 'rejected':['rejected','❌ Not approved'], 'cancelled':['cancelled','🚫 Cancelled']
};
const OPEN = ['new','waiting approval','approved'];
const DONE = ['purchased','received'];
function hfPill(r){const s=STATUS[r.status]||['',r.status];return `<span class="pill ${s[0]}">${hfEsc(s[1])}</span>`}

function hfRender(){
  try{ render_(); }
  catch(e){
    HF_ERRORS.push('screen: '+(e&&e.message?e.message:e));
    document.getElementById('app').innerHTML=`<div class="center"><div><div style="font-size:40px">⚠️</div><p><b>Couldn't show the screen</b></p><p>Code R: ${hfEsc(HF_ERRORS.join(' | '))}</p><p>Step: ${hfEsc(HF_STEP)} · v${HF_VERSION}</p><p><button class="btn main" type="button" onclick="location.reload()">Try again</button></p></div></div>`;
  }
}
function render_(){
  const app=document.getElementById('app'), bar=document.getElementById('bar');
  bar.hidden=true;
  if(!tg || !tg.initData){app.innerHTML=`<div class="center"><div><div style="font-size:40px">🐟</div><p><b>Open this from Telegram</b></p><p>This app works inside the Happy Fish Purchasing bot. Open the bot in Telegram and tap <b>Open app</b>.</p></div></div>`;return}
  if(!API){app.innerHTML=`<div class="center"><p>This app link is missing its server address. Ask the purchaser to check the app link in BotFather.</p></div>`;return}
  const d=S.data;
  if(!d){app.innerHTML=`<div class="center" id="hfload"><div><div class="spin"></div>Connecting to the server… <span style="opacity:.6">(v10)</span></div></div>`;return}
  if(d.failed){app.innerHTML=`<div class="center"><div><div style="font-size:40px">⚠️</div><p><b>Couldn't load</b></p><p>${hfEsc(d.failed)}</p><p><button class="btn main" id="retry" type="button">Try again</button></p></div></div>`;document.getElementById('retry').onclick=()=>{S.data=null;hfRender();hfRun({action:'init'})};return}
  if(d.notelegram){app.innerHTML=`<div class="center"><p>Telegram couldn't confirm who you are. Close this and open it again from the bot.</p></div>`;return}
  if(!d.me){app.innerHTML=hfHead()+regView();bindReg();return}
  if(d.me.status==='pending'){app.innerHTML=hfHead()+`<div class="card"><h2>⏳ Waiting for approval</h2><p class="hint">Thanks, ${hfEsc(d.me.name)}. The purchaser has been asked to approve you. You'll get a Telegram message when it's done, then open this app again.</p><button class="btn" id="reload" type="button">Check again</button></div>`;document.getElementById('reload').onclick=()=>hfRun({action:'init'});return}
  if(d.me.status!=='active'){app.innerHTML=hfHead()+`<div class="card"><p>Your access isn't active. Please contact the purchaser.</p></div>`;return}

  const P = d.me.purchaser, rsAll = d.requests||[];
  const tabs = P ? ['tobuy','held','bought','new'] : (d.me.approver ? ['new','mine','todo'] : ['new','mine']);
  if(tabs.indexOf(S.tab)<0) S.tab = P ? 'tobuy' : 'new';
  let nav;
  if(P){
    const buyCount = rsAll.filter(r=>!r.hold&&!r.heldOnly&&(r.can.approve||r.can.purchased||(d.me.lead&&r.status==='approved'&&!r.assignee))).length;
    const heldCount = rsAll.filter(r=>r.hold||r.heldOnly).length;
    nav = `<nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="tobuy" class="${S.tab==='tobuy'?'on':''}"><span class="ti">🛒</span>To buy${buyCount?`<span class="badge">${buyCount}</span>`:''}</button>
    <button type="button" role="tab" data-tab="held" class="${S.tab==='held'?'on':''}"><span class="ti">⏸️</span>On hold${heldCount?`<span class="badge hb">${heldCount}</span>`:''}</button>
    <button type="button" role="tab" data-tab="bought" class="${S.tab==='bought'?'on':''}"><span class="ti">✅</span>Purchased</button>
  </nav>`;
  } else {
    const todoCount = rsAll.filter(r=>!r.hold&&r.can.approve).length;
    nav = `<nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="new" class="${S.tab==='new'?'on':''}"><span class="ti">🛒</span>Request</button>
    <button type="button" role="tab" data-tab="mine" class="${S.tab==='mine'?'on':''}"><span class="ti">📋</span>Mine</button>
    ${d.me.approver?`<button type="button" role="tab" data-tab="todo" class="${S.tab==='todo'?'on':''}"><span class="ti">📥</span>To do${todoCount?`<span class="badge">${todoCount}</span>`:''}</button>`:''}
  </nav>`;
  }
  let h = hfHead() + homeBanner() + nav;
  h+=msgBanner();
  if(S.tab==='new'){ if(P) h+=`<div class="newhead"><b>➕ New request</b><button type="button" class="btn" data-tab="tobuy">← Back</button></div>`; h+=formView();bar.hidden=false;bar.innerHTML=`<button class="btn main" id="submit" type="button" ${S.busy?'disabled':''}>${S.busy?'Sending…':'Send request'}</button>`}
  if(S.tab==='new'){} else if(S.tab==='mine') h+=mineView();
  else if(S.tab==='tobuy') h+=buyView();
  else if(S.tab==='held') h+=heldView();
  else if(S.tab==='bought') h+=boughtView();
  else h+=todoView();
  app.innerHTML=h;
  bindMain();
}
function hfHead(){
  const me=S.data&&S.data.me;
  const nb=me&&me.purchaser&&me.status==='active'?`<button type="button" class="newbtn ${S.tab==='new'?'on':''}" data-tab="new" aria-label="New request">➕<span>New</span></button>`:'';
  return `<div class="head"><div class="logo" aria-hidden="true">🐟</div><div style="flex:1;min-width:0"><h1>Happy Fish Purchasing</h1><div class="sub">${me?hfEsc(me.name)+' · '+hfEsc(me.purchaser?'Purchaser':me.role):'Purchase requests for all branches'}</div></div>${nb}</div>`;
}
function msgBanner(){
  const un=(S.data.requests||[]).filter(r=>r.unread>0);
  if(!un.length) return '';
  const n=un.reduce((a,r)=>a+r.unread,0);
  const nm=un.reduce((a,r)=>a+(r.unreadMsgs||0),0);
  return `<div class="msgban"><div class="mbh"><b>${hfNewLbl(n,nm)}</b></div><div class="mbl">${un.slice(0,6).map(r=>`<button type="button" class="mbi" data-openmsg="${hfEsc(r.ref)}"><span>${hfEsc(r.items.length>1?r.items.map(x=>x.n).join(', '):r.item).slice(0,40)}</span><small>${hfEsc((r.msgs[r.msgs.length-1]||{}).name||'')} · ${hfEsc(r.ref)}</small><span class="mbc">${r.unread}</span></button>`).join('')}</div></div>`;
}
function homeBanner(){
  if(S.home!=='missed') return '';
  return `<div class="banner"><span>📲 Add this app to your phone's home screen for one-tap requests.</span><button class="btn main" id="addhome" type="button" style="padding:8px 12px">Add</button></div>`;
}

      ${(d.forNames||[]).length?`<div class="chips">${d.forNames.slice(0,6).map(n=>`<button type="button" class="chip ${f.forName===n?'on':''}" data-forpick="${hfEsc(n)}">${hfEsc(n)}</button>`).join('')}</div>`:''}
      ${d.me.selfApprove?'<span class="hint">When you request for someone else, it is approved straight away.</span>':''}
    </div>

      <div class="chips">${NEEDS.map(n=>`<button type="button" class="chip ${n[0]==='urg'?'urg':''} ${f.needKey===n[0]?'on':''}" data-need="${n[0]}">${n[1]}</button>`).join('')}</div>
      ${f.needKey==='date'?`<input class="i" type="date" data-f="need" value="${hfEsc(f.need)}" min="${ymd(new Date())}">`:''}
    </div>
    <div class="f" style="display:grid;gap:6px"><span class="hint" style="font-weight:600">Photos (optional, up to 6)</span>
      <div class="thumbs">${f.photos.map((p,i)=>`<div class="thumb"><img src="${p}" alt="Photo ${i+1}"><button type="button" data-rmph="${i}" aria-label="Remove photo ${i+1}">×</button></div>`).join('')}
      ${f.photos.length<6?`<button type="button" class="addph" id="addph">📷<br>Add</button>`:''}</div>
      <input type="file" id="phinput" accept="image/*" multiple hidden>
    </div>

/* lists */
function reqCard(r){
  const open=S.open===r.ref;
  const st=(STATUS[r.status]||['closed'])[0], live=OPEN.includes(r.status);
  const late=live&&r.status!=='purchased'&&r.need&&r.need<hfToday();
  let h=`<div class="req s-${st} ${r.urgent&&live?'urgent':''} ${open?'open':''} ${r.unread?'hasmsg':''} ${r.hold||r.heldOnly?'held':''}" data-ref="${hfEsc(r.ref)}">
    <div class="top"><div class="it">${r.items.length>1?`🧺 ${r.items.length} items${r.status==='approved'&&r.items.some(x=>x.done)?` <span class="meta">· ${r.items.filter(x=>x.done&&!x.no&&!x.held).length} of ${r.items.filter(x=>!x.no&&!x.held).length} bought</span>`:''}<div class="meta" style="font-weight:400">${hfEsc(r.items.map(x=>x.n).join(', ').slice(0,90))}</div>`:`${hfEsc(r.item)}${r.qty?` <span class="meta">× ${hfEsc(r.qty)}</span>`:''}`}</div>${hfPill(r)}</div>
    <div class="tags">${r.hold?`<span class="tag hold">⏸️ On hold${r.hold.reason?': '+hfEsc(r.hold.reason.slice(0,40)):''}</span>`:''}${!r.hold&&r.heldItems?`<span class="tag hold">⏸️ ${r.heldItems} item${r.heldItems>1?'s':''} on hold</span>`:''}${r.unread?`<span class="tag msg">${hfNewLbl(r.unread,r.unreadMsgs||0)}</span>`:''}${r.urgent&&live?'<span class="tag urg">🔥 Urgent</span>':''}${r.forName?`<span class="tag for">👑 For ${hfEsc(r.forName)}</span>`:''}<span class="tag">📍 ${hfEsc(r.branch)}</span>${r.mine?'':`<span class="tag">🙂 ${hfEsc(r.requester)}</span>`}${r.needText?`<span class="tag ${late?'late':''}">📅 ${late?'Late · ':''}${hfEsc(r.needText)}</span>`:''}${S.data.team&&S.data.me.purchaser&&live?(r.assignee?`<span class="tag buyer ${r.assignedToMe?'me':''}">🛍️ ${hfWho(r)}</span>`:'<span class="tag buyer none">🛍️ Not assigned</span>'):''}</div>`;
  if(open) h+=hfDetail(r);
  return h+'</div>';
}
function hfDetail(r){
  const c=r.can, p=S.panel&&S.panel.ref===r.ref?S.panel:null;
  const rv=r.review&&(!r.review.after||S.reviewOn===r.ref)?r.review:null;
  if(rv&&(!S.dec||S.dec.ref!==r.ref)) S.dec={ref:r.ref,v:rv.current.slice()};
  const mixedCat=new Set(r.items.map(x=>x.c).filter(Boolean)).size>1;
  const ilist=r.items.length>1?`<div class="ilist">${r.items.map((it,i)=>{
    const mark=it.no?'<span>❌</span>':it.held?'<span>⏸️</span>':(it.canTick?`<button type="button" class="tick ${it.done?'on':''}" data-tick="${i}" aria-label="${it.done?'Untick':'Tick'} ${hfEsc(it.n)}">${it.done?'✓':''}</button>`:`<span>${it.done?'✅':'▫️'}</span>`);
    const right=rv?`<select class="dec" data-dec="${i}" aria-label="Decision for ${hfEsc(it.n)}"><option value="">Choose…</option>${rv.options.map(o=>`<option value="${hfEsc(o.code)}" ${S.dec.v[i]===o.code?'selected':''}>${hfEsc(o.label)}</option>`).join('')}</select>`
      :(it.no?'<span class="who">not approved</span>':it.held?'<span class="who heldw">on hold</span>':(it.buyer?`<span class="who">👤 ${it.mine?'You':hfEsc(String(it.buyer).split(' ')[0])}</span>`:''));
    return `<div class="irow ${it.done?'done':''} ${it.no?'no':''} ${it.held?'heldi':''}">${rv?`<span>${it.no?'❌':it.held?'⏸️':'▫️'}</span>`:mark}<span class="iname">${hfEsc(it.n)}${it.q?` <span class="meta">× ${hfEsc(it.q)}</span>`:''}${mixedCat&&it.c?`<span class="icat">${hfEsc(it.c)}</span>`:''}</span>${right}</div>`;
  }).join('')}${rv?`<div class="acts"><button class="btn good" id="savedec" type="button" ${S.busy?'disabled':''}>✔️ ${rv.after?'Save changes':'Save decisions'}</button>${rv.after?'<button class="btn" id="closedec" type="button">Back</button>':''}</div><div class="hint">${S.data.team?'Choose who buys each item, ⏸️ to hold it for now, or ❌ if it is not approved.':'Choose ✅, ⏸️ hold or ❌ for each item.'} The requester is told which items were approved.</div>`:''}${c.tick&&!rv?'<div class="hint">Tick each item when you buy it. When every approved item is ticked, the request is marked purchased.</div>':''}</div>`:'';
  let h=`<div class="det" data-stop="1">${ilist}<dl>
    <dt>Request no.</dt><dd class="ref">${hfEsc(r.ref)}</dd>
    <dt>Category</dt><dd>${hfEsc(r.category)}</dd>
    ${r.forName?`<dt>For</dt><dd>👑 ${hfEsc(r.forName)}</dd>`:''}
    <dt>Asked by</dt><dd>${hfEsc(r.requester)} (${hfEsc(r.role)})</dd>
    <dt>Sent</dt><dd>${hfEsc(r.created)}</dd>
    ${r.status==='waiting approval'?`<dt>Approver</dt><dd>${hfEsc(r.approver)}</dd>`:''}
    ${S.data.team&&OPEN.includes(r.status)?`<dt>Handled by</dt><dd>${r.assignee?hfWho(r):'Not assigned yet'}</dd>`:''}
    ${r.decidedBy?`<dt>Decided by</dt><dd>${hfEsc(r.decidedBy)}</dd>`:''}
    ${r.purchasedAt?`<dt>Purchased</dt><dd>${hfEsc(r.purchasedAt)}</dd>`:''}
    ${r.receivedAt?`<dt>Received</dt><dd>${hfEsc(r.receivedAt)}</dd>`:''}
    ${r.details?`<dt>Details</dt><dd>${hfEsc(r.details)}</dd>`:''}
    ${r.links.length?`<dt>Links</dt><dd>${r.links.map(l=>`<a href="${hfEsc(l)}" data-link="${hfEsc(l)}">${hfEsc(l.length>48?l.slice(0,46)+'…':l)}</a>`).join('<br>')}</dd>`:''}
    ${r.files?`<dt>Photos</dt><dd>${r.files} attached</dd>`:''}
  </dl>${r.hold?`<div class="holdbox">⏸️ <b>On hold</b>${r.hold.reason?': '+hfEsc(r.hold.reason):''}<div class="meta">${hfEsc(r.hold.by)} · ${hfEsc(r.hold.when)}</div></div>`:''}${(r.msgs||[]).length?`<div class="thread"><div class="th">💬 Messages</div>${r.msgs.map(m=>`<div class="bub ${m.mine?'me':''} ${m.note?'note':''} ${m.status?'stat':''}"><div class="bn">${m.mine?'You':hfEsc(m.name)}${m.note?' · update':m.status?' · status':''} · ${hfEsc(m.when)}</div>${hfEsc(m.text)}</div>`).join('')}${r.can.message&&!(S.panel&&S.panel.what==='message')?'<button class="btn reply" data-act="message" data-panel="1" data-stop type="button">↩️ Reply</button>':''}</div>`:''}${r.notes.length?`<div class="notes">${r.notes.map(hfEsc).join('\n')}</div>`:''}`;
  if(p){
    const label={hold:'Why is it on hold? (optional, the requester will see it)',reject:'Reason (the requester will see it)',note:'Update for the requester, e.g. supplier, price, ETA',message:'Your message'}[p.what];
    h+=`<label class="f">${label}<textarea class="i" id="ptext">${hfEsc(p.text||'')}</textarea></label>
      <div class="acts"><button class="btn ${p.what==='reject'?'bad':'main'}" data-act="${p.what}" data-send="1" type="button" ${S.busy?'disabled':''}>${p.what==='reject'?'Not approved':p.what==='note'?'Save note':p.what==='hold'?'⏸️ Put on hold':'Send'}</button><button class="btn" data-cancelpanel="1" type="button">Back</button></div>`;
  } else {
    const b=[];
    if(c.resume) b.push(`<button class="btn main" data-act="resume" type="button">▶️ Resume</button>`);
    const team=(c.approveTo||[]).length>0;
    const all=r.items.length>1?' all':'';
    if(c.approve) b.push(`<button class="btn good" data-act="approve" type="button">✅ Approve${all}${team?": I'll buy":''}</button>`);
    (c.approveTo||[]).forEach(p=>b.push(`<button class="btn good" data-act="approve" data-target="${hfEsc(p.id)}" type="button">✅ Approve${all}: ${hfEsc(String(p.name).split(' ')[0])} buys</button>`));
    if(c.take) b.push(`<button class="btn main" data-act="take" type="button">🙋 ${r.assignee?'Take back from '+hfEsc(String(r.assignee).split(' ')[0]):"I'll buy it"}</button>`);
    (c.give||[]).forEach(p=>b.push(`<button class="btn" data-act="give" data-target="${hfEsc(p.id)}" type="button">${p.back?'↩️ Hand back to ':'👉 Give to '}${hfEsc(String(p.name).split(' ')[0])}</button>`));
    if(c.reject) b.push(`<button class="btn bad" data-act="reject" data-panel="1" type="button">❌ Not approved</button>`);
    if(c.purchased) b.push(`<button class="btn good" data-act="purchased" type="button">🛒 ${r.items.length>1?((r.assignees||[]).length>1?'All my items bought':'All bought'):'Mark purchased'}</button>`);
    if(r.review&&r.review.after&&S.reviewOn!==r.ref) b.push(`<button class="btn" id="opendec" type="button">${r.heldItems?'⏸️ Change held items / who buys':'📝 Change items: who buys, hold, not approved'}</button>`);
    if(c.received) b.push(`<button class="btn good" data-act="received" type="button">📦 Received</button>`);
    if(c.note) b.push(`<button class="btn" data-act="note" data-panel="1" type="button">📝 Add note</button>`);
    if(c.message) b.push(`<button class="btn" data-act="message" data-panel="1" type="button">💬 ${r.mine&&!S.data.me.purchaser?'Message purchaser':'Message '+hfEsc(String(r.requester).split(' ')[0])}</button>`);
    if(c.photos) b.push(`<button class="btn" data-act="photos" type="button">📷 See photos in chat</button>`);
    if(c.hold) b.push(`<button class="btn hold" data-act="hold" data-panel="1" type="button">⏸️ Put on hold</button>`);
    if(c.undo) b.push(`<button class="btn" data-act="undo" type="button">↩️ ${hfEsc(r.undoLabel)}</button>`);
    if(c.cancel) b.push(`<button class="btn bad" data-act="cancel" type="button">🚫 Cancel request</button>`);
    if(b.length) h+=`<div class="acts">${b.join('')}</div>`;
  }
  return h+'</div>';
}
function hfToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hfSection(title, list, force){
  if(!list.length) return '';
  const st=(STATUS[list[0].status]||['closed'])[0], same=list.every(r=>r.status===list[0].status);
  const col=force||({new:'--c-new',wait:'--c-wait',approved:'--c-approved',purchased:'--c-purchased',received:'--c-received'}[st]||'--c-closed');
  return `<div class="sec" style="--sc:var(${force||same?col:'--accent'})">${hfEsc(title)}<span class="n">${list.length}</span></div>`+list.map(reqCard).join('');
}
function byPrio(a,b){if(a.urgent!==b.urgent)return a.urgent?-1:1;const na=a.need||'9999',nb=b.need||'9999';return na<nb?-1:na>nb?1:(a.ref<b.ref?-1:1)}
function mineView(){
  const rs=(S.data.requests||[]).filter(r=>r.mine);
  if(!rs.length) return `<div class="empty">You haven't sent any requests yet.<br>Tap <b>🛒 Request</b> to start.</div>`;
  return hfSection('Open',rs.filter(r=>OPEN.includes(r.status)).sort(byPrio))+hfSection('Purchased',rs.filter(r=>DONE.includes(r.status)).slice(0,20))+hfSection('Not approved / cancelled',rs.filter(r=>r.status==='rejected'||r.status==='cancelled').slice(0,10))+refreshBtn();
}
/** Which tab a request lives in, so tapping a new-message alert jumps to the right place. */
function hfTabOf(r){
  if(!S.data.me.purchaser) return r.mine?'mine':'todo';
  if(r.hold||r.heldOnly) return 'held';
  return OPEN.includes(r.status)?'tobuy':'bought';
}
function buyView(){
  const d=S.data, me=d.me, rs=(d.requests||[]).filter(r=>!r.hold&&!r.heldOnly&&OPEN.includes(r.status));
  const lead=!d.team||me.lead;
  let h='';
  if(lead) h+=hfSection('🆕 Waiting for your approval',rs.filter(r=>r.status==='new').sort(byPrio));
  if(d.team){
    if(lead) h+=hfSection('👉 Approved, choose who buys',rs.filter(r=>r.status==='approved'&&!r.assignee).sort(byPrio));
    h+=hfSection('🛒 To buy: mine',rs.filter(r=>r.status==='approved'&&r.assignedToMe).sort(byPrio));
    (d.purchasers||[]).filter(n=>n!==me.name).forEach(n=>{
      h+=hfSection('👤 '+n+' is buying',rs.filter(r=>r.status==='approved'&&(r.assignees||[]).includes(n)&&!r.assignedToMe).sort(byPrio),'--c-wait');
    });
  } else h+=hfSection('🛒 Approved, to buy',rs.filter(r=>r.status==='approved').sort(byPrio));
  if(lead) h+=hfSection('⏳ Older requests with approvers',rs.filter(r=>r.status==='waiting approval').sort(byPrio));
  return (h||`<div class="empty">🎉 Nothing to buy right now.</div>`)+refreshBtn();
}
function heldView(){
  const rs=(S.data.requests||[]).filter(r=>r.hold||r.heldOnly).sort(byPrio);
  return (rs.length?hfSection('⏸️ On hold',rs,'--c-hold'):`<div class="empty">Nothing is on hold.<br><span class="hint">Open a task in <b>🛒 To buy</b> and tap <b>⏸️ Put on hold</b> to park it here.</span></div>`)+refreshBtn();
}
function boughtView(){
  const rs=(S.data.requests||[]).filter(r=>DONE.includes(r.status)).sort((a,b)=>(b.purchasedKey||'').localeCompare(a.purchasedKey||''));
  if(!rs.length) return `<div class="empty">Nothing purchased in the last 45 days.</div>`+refreshBtn();
  const wk=new Date(Date.now()-6*864e5), wkKey=wk.getFullYear()+'-'+String(wk.getMonth()+1).padStart(2,'0')+'-'+String(wk.getDate()).padStart(2,'0');
  const today=hfToday();
  return hfSection('Today',rs.filter(r=>(r.purchasedKey||'').slice(0,10)===today),'--c-purchased')
    +hfSection('This week',rs.filter(r=>{const k=(r.purchasedKey||'').slice(0,10);return k<today&&k>=wkKey}),'--c-purchased')
    +hfSection('Earlier',rs.filter(r=>(r.purchasedKey||'').slice(0,10)<wkKey),'--c-purchased')+refreshBtn();
}
function todoView(){
  const all=S.data.requests||[], me=S.data.me, rs=all.filter(r=>!r.hold);
  let h='';
  if(me.purchaser){
    const lead=!S.data.team||S.data.me.lead;
    const mineOrFree=r=>r.assignedToMe||(!r.assignee&&lead);
    if(lead) h+=hfSection('Waiting for your approval',rs.filter(r=>r.status==='new').sort(byPrio));
    if(S.data.team){
      if(lead) h+=hfSection('Approved, choose who buys',rs.filter(r=>r.status==='approved'&&!r.assignee).sort(byPrio));
      h+=hfSection('To buy: mine',rs.filter(r=>r.status==='approved'&&r.assignedToMe).sort(byPrio));
    } else h+=hfSection('Approved, to buy',rs.filter(r=>r.status==='approved').sort(byPrio));
    h+=hfSection('Purchased, waiting for branch',rs.filter(r=>r.status==='purchased'&&mineOrFree(r)).sort(byPrio));
    if(lead) h+=hfSection('Older requests with approvers',rs.filter(r=>r.status==='waiting approval').sort(byPrio));
    h+=hfSection('⏸️ On hold',all.filter(r=>r.hold).sort(byPrio),'--c-hold');
  } else {
    h+=hfSection('Waiting for your approval',rs.filter(r=>r.status==='waiting approval'&&r.can.approve).sort(byPrio));
  }
  return (h||`<div class="empty">🎉 Nothing is waiting on you.</div>`)+refreshBtn();
}
function teamView(){
  const rs=(S.data.requests||[]).filter(r=>OPEN.includes(r.status));
  const order={'new':0,'waiting approval':1,'approved':2,'purchased':3};
  const srt=(a,b)=>(order[a.status]-order[b.status])||byPrio(a,b);
  const names=[...new Set(rs.flatMap(r=>(r.assignees||[]).filter(n=>n!==S.data.me.name)))];
  (S.data.purchasers||[]).forEach(n=>{if(n!==S.data.me.name&&!names.includes(n))names.push(n)});
  const mine=rs.filter(r=>r.assignedToMe).sort(srt), free=rs.filter(r=>!r.assignee).sort(srt);
  let h=`<div class="card" style="gap:6px"><b>Who is handling what</b><div class="hint">🙋 You: <b>${mine.length}</b>${names.map(n=>` · 👤 ${hfEsc(n)}: <b>${rs.filter(r=>(r.assignees||[]).includes(n)).length}</b>`).join('')} · Not assigned: <b>${free.length}</b></div></div>`;
  h+=hfSection('🙋 You are handling',mine)||`<div class="sec">🙋 You are handling (0)</div><div class="empty" style="padding:10px">Nothing right now.</div>`;
  names.forEach(n=>{const l=rs.filter(r=>(r.assignees||[]).includes(n)).sort(srt);h+=hfSection('👤 '+n+' is handling',l)||`<div class="sec">👤 ${hfEsc(n)} is handling (0)</div><div class="empty" style="padding:10px">Nothing right now.</div>`});
  h+=hfSection('Not assigned yet',free);
  return h+refreshBtn();
}
function refreshBtn(){return `<button class="btn block" id="refresh" type="button" ${S.busy?'disabled':''}>${S.busy?'Loading…':'↻ Refresh'}</button>`}

/* ---------- events ---------- */
function bindMain(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.open=null;S.panel=null;hfRender();window.scrollTo(0,0)});
  const ah=document.getElementById('addhome'); if(ah) ah.onclick=()=>{try{tg.addToHomeScreen()}catch(_){}};
  const rf=document.getElementById('refresh'); if(rf) rf.onclick=()=>hfRun({action:'init'});
  if(S.tab==='new') bindForm();
  document.querySelectorAll('.req').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('[data-stop]')) return;
    S.open = S.open===el.dataset.ref?null:el.dataset.ref; S.panel=null; hfRender();
    if(S.open) hfSeen(S.open);
  }));
  document.querySelectorAll('[data-openmsg]').forEach(b=>b.onclick=()=>{
    const ref=b.dataset.openmsg, r=(S.data.requests||[]).find(x=>x.ref===ref);
    if(r){ S.tab=hfTabOf(r); S.open=ref; S.panel=null; hfRender(); hfSeen(ref);
      const el=document.querySelector(`.req[data-ref="${ref}"]`); if(el) el.scrollIntoView({block:'start',behavior:'smooth'}); }
  });
  document.querySelectorAll('[data-link]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();try{tg.openLink(a.dataset.link)}catch(_){window.open(a.dataset.link)}}));
  document.querySelectorAll('[data-tick]').forEach(b=>b.onclick=()=>hfRun({action:'act',ref:S.open,what:'tick',text:b.dataset.tick}));
  document.querySelectorAll('[data-dec]').forEach(el=>{el.addEventListener('click',e=>e.stopPropagation());el.onchange=()=>{if(S.dec)S.dec.v[Number(el.dataset.dec)]=el.value}});
  const sd=document.getElementById('savedec'); if(sd) sd.onclick=()=>{
    if(!S.dec||S.dec.v.some(x=>!x)){hfToast('Please choose for every item.',true);return}
    hfRun({action:'act',ref:S.open,what:'decide',text:JSON.stringify(S.dec.v)}).then(d=>{if(d&&!d.error){S.dec=null;S.reviewOn=null;hfRender()}});
  };
  const od=document.getElementById('opendec'); if(od) od.onclick=()=>{S.reviewOn=S.open;S.dec=null;hfRender()};
  const cd=document.getElementById('closedec'); if(cd) cd.onclick=()=>{S.reviewOn=null;S.dec=null;hfRender()};
  document.querySelectorAll('[data-cancelpanel]').forEach(b=>b.onclick=()=>{S.panel=null;hfRender()});
  const pt=document.getElementById('ptext'); if(pt){pt.addEventListener('input',e=>S.panel.text=e.target.value);pt.focus()}
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const ref=S.open, what=b.dataset.act;
    if(b.dataset.panel){S.panel={ref,what,text:''};hfRender();return}
    const text=b.dataset.target?b.dataset.target:(b.dataset.send?(S.panel&&S.panel.text||'').trim():'');
    if(b.dataset.send&&what!=='reject'&&what!=='hold'&&!text){hfToast('Type something first.',true);return}
    const go=()=>hfRun({action:'act',ref,what,text}).then(d=>{if(d&&!d.error){S.panel=null;hfRender()}});
    if(what==='cancel'){confirmThen('Cancel this request?',go)}else if(what==='undo'){confirmThen(r0Label()+'?',go)}else go();
  });
}
function hfWho(r){const a=(r.assignees&&r.assignees.length?r.assignees:[r.assignee]);return a.map(n=>n===S.data.me.name?'You':hfEsc(n)).join(' & ')}
function r0Label(){const r=(S.data.requests||[]).find(x=>x.ref===S.open);return r?r.undoLabel:'Undo'}
function confirmThen(msg,fn){try{tg.showConfirm(msg,ok=>{if(ok)fn()})}catch(_){fn()}}
function bindForm(){
  const f=S.form;
  document.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener('input',e=>{f[el.dataset.f]=e.target.value});
    if(el.tagName==='SELECT') el.addEventListener('change',()=>hfRender());
  });
  document.querySelectorAll('[data-forpick]').forEach(b=>b.onclick=()=>{f.forName=f.forName===b.dataset.forpick?'':b.dataset.forpick;hfRender()});
  document.querySelectorAll('[data-need]').forEach(b=>b.onclick=()=>{
    const n=NEEDS.find(x=>x[0]===b.dataset.need); f.needKey=n[0]; f.urgent=n[0]==='urg';
    f.need = n[2]===null ? (n[0]==='date'?f.need:'') : addDays(n[2]); hfRender();
  });
  const add=document.getElementById('addph'), inp=document.getElementById('phinput');
  if(add) add.onclick=()=>inp.click();
  inp.onchange=async()=>{
    const files=[...inp.files].slice(0,6-f.photos.length);
    for(const file of files){try{f.photos.push(await shrink(file))}catch(_){hfToast("Couldn't read one of the photos.",true)}}
    hfRender();
  };
  document.querySelectorAll('[data-it]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',e=>{f.items[Number(el.dataset.it)][el.dataset.k]=e.target.value;if(el.tagName==='SELECT')el.classList.toggle('empty',!e.target.value)}));
  document.querySelectorAll('[data-rmit]').forEach(b=>b.onclick=()=>{f.items.splice(Number(b.dataset.rmit),1);hfRender()});
  const ai=document.getElementById('additem'); if(ai) ai.onclick=()=>{f.items.push({n:'',q:'',c:(f.items[f.items.length-1]||{}).c||''});hfRender();const els=document.querySelectorAll('[data-k="n"]');if(els.length)els[els.length-1].focus()};
  document.querySelectorAll('[data-rmph]').forEach(b=>b.onclick=()=>{f.photos.splice(Number(b.dataset.rmph),1);hfRender()});
  const sb=document.getElementById('submit');
  if(sb) sb.onclick=async()=>{
    if(!f.branch){hfToast('Please choose a branch.',true);return}
    const items=f.items.map(x=>({n:x.n.trim(),q:x.q.trim(),c:x.c||''})).filter(x=>x.n);
    if(!items.length){hfToast('Please type what you need.',true);return}
    if(items.some(x=>!x.q)){hfToast('Please add the quantity for each item.',true);return}
    if(items.some(x=>!x.c)){hfToast('Please choose a category for each item.',true);return}
    if(f.needKey==='date'&&!f.need){hfToast('Please pick the date.',true);return}
    const d=await hfRun({action:'submit',branch:f.branch,forName:(f.forName||'').trim(),items,need:f.need,urgent:f.urgent,links:f.links,details:f.details,photos:f.photos});
    if(d&&!d.error){S.form={branch:f.branch,forName:'',items:[{n:'',q:'',c:''}],need:'',needKey:'',urgent:false,links:'',details:'',photos:[]};S.tab=S.data.me.purchaser?'tobuy':'mine';hfRender();window.scrollTo(0,0)}
  };
}
function shrink(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1280, k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject()};
    img.src=url;
  });
}

/* ---------- start ---------- */
if(tg){
  tg.ready(); tg.expand();
  try{tg.setHeaderColor('secondary_bg_color')}catch(_){}
  try{ if(tg.isVersionAtLeast&&tg.isVersionAtLeast('8.0')) tg.checkHomeScreenStatus(st=>{S.home=st;hfRender()}); }catch(_){}
  try{ tg.onEvent('homeScreenAdded',()=>{S.home='added';hfToast('Added to your home screen 🎉');hfRender()}); }catch(_){}
}
hfRender();
if(tg&&tg.initData&&API) hfRun({action:'init'});
</script>
